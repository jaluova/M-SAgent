<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" fill="none">
  <rect width="1280" height="760" rx="28" fill="#FBF7F0"/>
  <text x="66" y="78" fill="#8E4B2C" font-size="28" font-family="Arial, PingFang SC, sans-serif" font-weight="700">缺陷分类图</text>
  <text x="66" y="112" fill="#6A5E51" font-size="18" font-family="Arial, PingFang SC, sans-serif">效果问题最显眼，但往往由策略边界、状态模型和说明缺口共同放大</text>

  <rect x="92" y="170" width="300" height="118" rx="20" fill="#FBE7E7" stroke="#D39D9D"/>
  <text x="120" y="212" fill="#8B2F2F" font-size="24" font-family="Arial, PingFang SC, sans-serif" font-weight="700">效果问题</text>
  <text x="120" y="244" fill="#6A5E51" font-size="18" font-family="Arial, PingFang SC, sans-serif">工具选错、回退低价值、</text>
  <text x="120" y="270" fill="#6A5E51" font-size="18" font-family="Arial, PingFang SC, sans-serif">定位后端行为不对称、评估信息过少</text>

  <rect x="488" y="170" width="300" height="118" rx="20" fill="#FFF3E4" stroke="#D7B28A"/>
  <text x="516" y="212" fill="#A45C18" font-size="24" font-family="Arial, PingFang SC, sans-serif" font-weight="700">稳定性问题</text>
  <text x="516" y="244" fill="#6A5E51" font-size="18" font-family="Arial, PingFang SC, sans-serif">配置漂移、回退解释不足、</text>
  <text x="516" y="270" fill="#6A5E51" font-size="18" font-family="Arial, PingFang SC, sans-serif">排障难度高</text>

  <rect x="884" y="170" width="300" height="118" rx="20" fill="#EEF4E8" stroke="#A9C19A"/>
  <text x="912" y="212" fill="#2D6A4F" font-size="24" font-family="Arial, PingFang SC, sans-serif" font-weight="700">维护性问题</text>
  <text x="912" y="244" fill="#6A5E51" font-size="18" font-family="Arial, PingFang SC, sans-serif">闲置状态、测试入口弱、</text>
  <text x="912" y="270" fill="#6A5E51" font-size="18" font-family="Arial, PingFang SC, sans-serif">边界不够显式</text>

  <rect x="310" y="392" width="660" height="174" rx="24" fill="#FFFDF8" stroke="#D7CFC2" stroke-width="2"/>
  <text x="340" y="434" fill="#8E4B2C" font-size="28" font-family="Arial, PingFang SC, sans-serif" font-weight="700">共同结果</text>
  <text x="340" y="474" fill="#6A5E51" font-size="20" font-family="Arial, PingFang SC, sans-serif">1. 你看到的是“效果差”，但很难第一时间知道差在哪里</text>
  <text x="340" y="506" fill="#6A5E51" font-size="20" font-family="Arial, PingFang SC, sans-serif">2. 你想改时，容易被状态噪音、回退链和说明缺口拖住</text>
  <text x="340" y="538" fill="#6A5E51" font-size="20" font-family="Arial, PingFang SC, sans-serif">3. 没有先把系统行为讲清楚，后面的效果优化很容易变成盲调</text>

  <rect x="420" y="614" width="444" height="82" rx="20" fill="#F5E8D9" stroke="#CFAE8E"/>
  <text x="452" y="662" fill="#8E4B2C" font-size="24" font-family="Arial, PingFang SC, sans-serif" font-weight="700">整改思路：先收台面，再清边界，最后做实跑优化</text>

  <path d="M242 288V352H640V392" stroke="#8B2F2F" stroke-width="4" stroke-linecap="round"/>
  <path d="M638 288V352" stroke="#A45C18" stroke-width="4" stroke-linecap="round"/>
  <path d="M1034 288V352H640" stroke="#2D6A4F" stroke-width="4" stroke-linecap="round"/>
  <path d="M640 566V612" stroke="#8E4B2C" stroke-width="4" stroke-linecap="round"/>
</svg>
