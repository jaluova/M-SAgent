name: Python 3.10

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install minimal checks
        run: python3.10 -m pip install --upgrade pip ruff

      - name: Run Python 3.10 checks
        run: bash scripts/check_py310.sh
