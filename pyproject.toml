[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msagent"
version = "0.0.0"
requires-python = ">=3.10,<3.11"

[project.optional-dependencies]
api = [
    "fastapi>=0.116,<0.117",
    "uvicorn>=0.35,<0.36",
]
api-test = [
    "fastapi>=0.116,<0.117",
    "uvicorn>=0.35,<0.36",
    "httpx>=0.28,<0.29",
]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
